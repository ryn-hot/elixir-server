id: elixir.connectors.prowlarr_flaresolverr_proxy
version: 1.1.0
kind: connector
name: "Prowlarr FlareSolverr Proxy"
description: "Register the managed FlareSolverr service as a Prowlarr indexer proxy."
publisher:
  name: "Elixir"
  key_id: "ed25519:ZXcPdxnr1ziJpDC3TwCNXWkt1vG7njkyQ/3l52mEhQI="
trust: community
permissions:
  - drivers.configure.indexer.registry
requires:
  - capability: indexer.proxy
    slot: flaresolverr
targets:
  - capability: indexer.registry
    slot: default
actions:
  - type: driver_patch
    target:
      capability: indexer.registry
      slot: default
    patch:
      op: register_indexer_proxies
      proxies:
        - name: "FlareSolverr"
          implementation: "FlareSolverr"
          tags: ["flaresolverr"]
          enabled: true
          settings:
            host: "http://elx-flaresolverr:8191/"
            requestTimeout: 180
