id: elixir.modules.sonarr
version: 1.0.2
kind: module
name: "Sonarr"
description: "TV series manager module backed by Sonarr."
publisher:
  name: "Elixir"
  key_id: "ed25519:ZXcPdxnr1ziJpDC3TwCNXWkt1vG7njkyQ/3l52mEhQI="
trust: community
permissions:
  - runtime.manage_containers
  - network.egress
provides:
  - capability: media.manager.tv
    slot: default
    cardinality: one
    implementation: sonarr
    scope:
      media_types: ["series", "anime"]
      actions: ["add", "monitor", "search"]
      requires_account: false
      required_fields: []
  - capability: media.search.tv
    slot: default
    cardinality: many
    implementation: sonarr
    scope:
      media_types: ["series"]
      actions: ["search"]
      requires_account: false
      required_fields: []
  - capability: media.search.anime
    slot: default
    cardinality: many
    implementation: sonarr
    scope:
      media_types: ["anime"]
      actions: ["search"]
      requires_account: false
      required_fields: []
requires: []
conflicts:
  - capability: media.manager.tv
    slot: default
    policy: prompt_replace
runtime:
  type: container
  image: "lscr.io/linuxserver/sonarr:4.0.0"
  network: "elixir_net"
  service_name: "elx-sonarr"
  ports:
    - container: 8989
      host: 0
  volumes:
    - "{downloads}:/downloads"
    - "{media}/tv:/tv"
backup:
  retention: 5
  items:
    - id: config
      label: "Sonarr configuration"
      container_path: /config
networking:
  service_port:
    scheme: http
    container_port: 8989
